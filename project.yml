name: ArcWatchAI
options:
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
targetTemplates:
  App:
    type: application
    sources:
      - Shared
      - Resources
    info:
      path: Config/${target_name}.plist
      properties:
        CFBundleDisplayName: Arc Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: 连接你在服务商设置中填写的局域网 API 地址。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
targets:
  ArcWatchAI:
    templates: [App]
    platform: iOS
    sources: [Phone]
    info:
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onyxaxis.ArcWatchAI
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - target: ArcWatch
        embed: true
  ArcWatch:
    templates: [App]
    platform: watchOS
    sources: [Watch]
    info:
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.onyxaxis.ArcWatchAI
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onyxaxis.ArcWatchAI.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
schemes:
  ArcWatchAI:
    build:
      targets:
        ArcWatchAI: all
  ArcWatch:
    build:
      targets:
        ArcWatch: all
